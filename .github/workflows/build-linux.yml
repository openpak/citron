name: Build Citron (Linux)

concurrency:
  group: build-nightly-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check-version:
    name: Get the commit to build
    runs-on: ubuntu-24.04
    outputs:
      new_hash: ${{ steps.head.outputs.hash_short }}
      new_hash_full: ${{ steps.head.outputs.hash_full }}
    steps:
      - uses: actions/checkout@v4

      - name: Get current commit hash
        id: head
        run: |
          echo "hash_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
          echo "hash_full=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT

  build:
    name: "${{ matrix.name }}"
    needs: [check-version]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: "Citron Build (Normal x86_64)"
            os: ubuntu-24.04
            artifact_suffix: "_x86_64"
            script_suffix: ""
            build_arg: ""
          - name: "Citron Build (Optimized x86_64)"
            os: ubuntu-24.04
            artifact_suffix: "_v3"
            script_suffix: "_v3"
            build_arg: "v3"
          # GitHub's native arm64 runner, with the arm64 variant of the same Arch container.
          - name: "Citron Build (aarch64)"
            os: ubuntu-24.04-arm
            artifact_suffix: "_aarch64"
            script_suffix: ""
            build_arg: ""

    container:
      image: ghcr.io/pkgforge-dev/archlinux:latest
      # A hosted runner has about 14 GB free, too little for this build. The steps run inside
      # the container, so the host's large preinstalled toolsets it does not use are mounted in
      # and emptied from there (the container is root on the host's Docker).
      volumes:
        - /usr/local/lib/android:/host-free/android
        - /opt/ghc:/host-free/ghc
        - /usr/share/dotnet:/host-free/dotnet

    steps:
      - name: Free disk space
        run: |
          df -h /
          rm -rf /host-free/android/* /host-free/ghc/* /host-free/dotnet/*
          df -h /

      - name: Install Git
        run: pacman -Syu --noconfirm --needed git

      - uses: actions/checkout@v4
        with:
          # openpak-client is private: GITHUB_TOKEN reads only this repo.
          token: ${{ secrets.OPENPAK_MODULE_TOKEN || github.token }}
          submodules: recursive

      # The container runs as root over a workspace the runner's user owns: git refuses it as
      # "dubious ownership" unless told otherwise.
      - name: Add Git Safe Directory
        run: git config --global --add safe.directory "$PWD"

      - name: Install dependencies
        run: chmod +x ./get-dependencies.sh && ./get-dependencies.sh

      - name: Build Citron from source
        run: |
          chmod +x ./build-citron.sh
          JOBS=$(nproc) DEVEL=false ./build-citron.sh ${{ matrix.build_arg }}

      - name: Package AppImage with Correct Name
        run: |
          GIT_SHA=$(git rev-parse --short HEAD)
          export APP_VERSION="${GIT_SHA}"
          export VERSION="${GIT_SHA}"
          export ARCH_SUFFIX="${{ matrix.script_suffix }}"
          export DEVEL="false"
          chmod +x ./package-citron.sh
          ./package-citron.sh

      - name: Attach to the tag's release
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/github-script@v7
        with:
          script: |
            await require(`${process.env.GITHUB_WORKSPACE}/.github/scripts/attach-to-release.js`)({ github, context, glob, core }, 'dist/*.AppImage*\ndist/*.tar.zst');

  # Runs when at least one leg published: a failed leg must not hold back the others' release
  # or the announcement. Which legs made it is read from the release itself.
  release:
    if: ${{ !cancelled() && startsWith(github.ref, 'refs/tags/v') }}
    name: "release"
    needs: [check-version, build]
    permissions:
      contents: write
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: Collect the legs that published
        id: legs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ needs.check-version.outputs.new_hash }}
        run: |
          assets=$(gh release view "${{ github.ref_name }}" --repo "${{ github.repository }}" --json assets -q '.assets[].name' || true)
          built=""; missing=""
          for leg in x86_64 x86_64_v3 aarch64; do
            if grep -qx "citron_nightly-${SHA}-linux-${leg}.AppImage" <<<"$assets"; then
              built="$built $leg"
            else
              missing="$missing $leg"
            fi
          done
          built=${built# }; missing=${missing# }
          {
            echo "### Linux ${{ github.ref_name }} \`${SHA}\`"
            echo "- Published: ${built:-none}"
            echo "- Missing: ${missing:-none}"
            echo "- Build results: matrix \`${{ needs.build.result }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "built=${built}" >> "$GITHUB_OUTPUT"
          if [ -z "$built" ]; then
            echo "::error::No leg published to ${{ github.ref_name }}."
            exit 1
          fi
          [ -z "$missing" ] || echo "::warning::Not published this time: ${missing}"

      - name: Post to Discord
        run: |
          DOWNLOAD_URL="https://github.com/${{ github.repository }}/releases/tag/${{ github.ref_name }}"
          DATE=$(date +'%Y-%m-%d')
          WEBHOOK_URL="${{ secrets.DISCORD_WEBHOOK }}"
          if [ -z "$WEBHOOK_URL" ]; then
            echo "DISCORD_WEBHOOK is not set; skipping Discord notification."
            exit 0
          fi
          curl -H "Content-Type: application/json" \
               -d "{\"content\":\"🐧 **New Linux Build Available!**\n\n📦 **Version:** \`${{ github.ref_name }}\` (${{ needs.check-version.outputs.new_hash }})\n📅 **Date:** ${DATE}\n🔗 **Download:** $DOWNLOAD_URL\n\n✨ Builds: ${{ steps.legs.outputs.built }}\"}" \
               "$WEBHOOK_URL"
