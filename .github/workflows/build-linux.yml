name: Build Citron (Linux)

concurrency:
  group: build-nightly-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
    inputs:
      aarch64:
        # Under qemu the aarch64 leg holds a self-hosted runner for hours, and the org's two
        # runners also build every server release; it runs only when asked for.
        description: 'Also build aarch64 (qemu, several hours on a self-hosted runner)'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  check-version:
    name: Check if new version available
    runs-on: [self-hosted, linux, podman]
    outputs:
      should_build: ${{ steps.compare.outputs.should_build }}
      new_hash: ${{ steps.head.outputs.hash_short }}
      new_hash_full: ${{ steps.head.outputs.hash_full }}
    steps:
      - uses: actions/checkout@v4

      - name: Get current commit hash
        id: head
        run: |
          echo "hash_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
          echo "hash_full=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT

      - name: Get last built version
        id: last_built
        run: |
          LAST_HASH=$(cat LATEST_VERSION 2>/dev/null | tr -d '\n' || echo "none")
          echo "last_hash=$LAST_HASH" >> $GITHUB_OUTPUT
          echo "Last built hash: $LAST_HASH"

      - name: Check if release exists
        id: release_check
        run: |
          if gh release view nightly-linux --repo "${{ github.repository }}" > /dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "Release exists"
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "Release does not exist"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      - name: Compare versions
        id: compare
        run: |
          if [ "${{ steps.head.outputs.hash_short }}" != "${{ steps.last_built.outputs.last_hash }}" ]; then
            echo "should_build=true" >> $GITHUB_OUTPUT
            echo "✅ New version detected - will build"
          elif [ "${{ steps.release_check.outputs.exists }}" != "true" ]; then
            echo "should_build=true" >> $GITHUB_OUTPUT
            echo "✅ No release exists - will build"
          else
            echo "should_build=false" >> $GITHUB_OUTPUT
            echo "⏭️ No changes - skipping build"
          fi

      # Artifacts no longer carry the build between jobs: the organisation's artifact quota
      # filled up and stopped every release (2026-09-23). The release is made here, before the
      # builds, and each build attaches its own files to it.
      - name: Replace the nightly release
        if: steps.compare.outputs.should_build == 'true' && github.ref_name == 'main'
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const tag = 'nightly-linux';
            try {
              const old = await github.rest.repos.getReleaseByTag({ owner, repo, tag });
              await github.rest.repos.deleteRelease({ owner, repo, release_id: old.data.id });
            } catch (e) { if (e.status !== 404) throw e; }
            try {
              await github.rest.git.deleteRef({ owner, repo, ref: `tags/${tag}` });
            } catch (e) { if (e.status !== 404 && e.status !== 422) throw e; }
            const sha = '${{ steps.head.outputs.hash_full }}';
            const short = '${{ steps.head.outputs.hash_short }}';
            const date = new Date().toISOString().slice(0, 10);
            await github.rest.repos.createRelease({
              owner, repo, tag_name: tag, target_commitish: sha, make_latest: 'false',
              name: `Continuous Build (Linux Nightly: ${short})`,
              body: `**Citron Commit:** [\`${short}\`](https://github.com/${owner}/${repo}/commit/${sha})\n\n` +
                    `**Build Details:**\n- Platform: Linux (x86_64, x86_64_v3, aarch64)\n` +
                    `- Format: AppImage + tar.zst packages\n- Build Type: Release with optimizations\n- Date: ${date}`,
            });

  build:
    name: "${{ matrix.name }}"
    needs: [check-version]
    if: needs.check-version.outputs.should_build == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: "Citron Build (Normal x86_64)"
            os: [self-hosted, linux, podman]
            artifact_suffix: "_x86_64"
            script_suffix: ""
            build_arg: ""
          - name: "Citron Build (Optimized x86_64)"
            os: [self-hosted, linux, podman]
            artifact_suffix: "_v3"
            script_suffix: "_v3"
            build_arg: "v3"

    container: ghcr.io/pkgforge-dev/archlinux:latest

    steps:
      - name: Install Git
        run: pacman -Syu --noconfirm --needed git

      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Add Git Safe Directory
        run: git config --global --add safe.directory "$PWD"

      - name: Install dependencies
        run: chmod +x ./get-dependencies.sh && ./get-dependencies.sh

      - name: Build Citron from source
        run: |
          NPROC_VAL=$(nproc --all)
          JOBS_VAL=$((NPROC_VAL > 4 ? 4 : NPROC_VAL))
          chmod +x ./build-citron.sh
          JOBS=${JOBS_VAL} DEVEL=false ./build-citron.sh ${{ matrix.build_arg }}

      - name: Package AppImage with Correct Name
        run: |
          GIT_SHA=$(git rev-parse --short HEAD)
          export APP_VERSION="${GIT_SHA}"
          export VERSION="${GIT_SHA}"
          export ARCH_SUFFIX="${{ matrix.script_suffix }}"
          export DEVEL="false"
          chmod +x ./package-citron.sh
          ./package-citron.sh

      - name: Attach to the nightly release
        if: ${{ github.ref_name == 'main' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "nightly-linux"
          make_latest: false
          files: |
            dist/*.AppImage*
            dist/*.tar.zst

      # The container runs as root on the self-hosted runner, and root-owned files left in the
      # workspace stop the next job's checkout, which runs as the runner's user (2026-09-23).
      - name: Hand the workspace back to the runner
        if: always()
        run: chown -R "$(stat -c %u:%g "$GITHUB_WORKSPACE/..")" "$GITHUB_WORKSPACE"

  # GitHub-hosted runners, ubuntu-24.04-arm included, do not start for this organisation (the
  # jobs fail with 0 steps: "recent account payments have failed or your spending limit needs
  # to be increased", 2026-09-23). The aarch64 build therefore runs on the self-hosted x86_64
  # runner, in the arm64 variant of the same Arch container, under qemu-user: the host has
  # qemu-aarch64 registered in binfmt_misc with the F flag, so arm64 containers run as they are.
  # It is native arm64 code, only emulated, so it is several times slower than the x86_64 legs;
  # the container gets a low CPU weight so it yields to anything interactive on the host.
  # The job does not use `container:` because the runner's node, which runs the actions, is an
  # x86_64 binary and would not start inside an arm64 container.
  build-aarch64:
    name: "Citron Build (aarch64, qemu)"
    needs: [check-version]
    if: needs.check-version.outputs.should_build == 'true' && inputs.aarch64
    runs-on: [self-hosted, linux, podman]
    timeout-minutes: 600
    env:
      IMAGE: ghcr.io/pkgforge-dev/archlinux:latest
      CONTAINER: citron-aarch64-${{ github.run_id }}-${{ github.run_attempt }}

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Check that arm64 binaries can run here
        run: |
          if ! grep -qs '^enabled' /proc/sys/fs/binfmt_misc/qemu-aarch64; then
            echo "::error::qemu-aarch64 is not registered in binfmt_misc on $(hostname); install qemu-user-static(-binfmt) there."
            exit 1
          fi
          docker pull --platform linux/arm64 "$IMAGE"
          docker run --rm --platform linux/arm64 "$IMAGE" uname -m | grep -qx aarch64

      - name: Build and package Citron in an arm64 container
        run: |
          docker run --rm --name "$CONTAINER" --platform linux/arm64 --cpu-shares 256 \
            -v "$GITHUB_WORKSPACE:/src" -w /src \
            -e HOST_OWNER="$(id -u):$(id -g)" \
            -e GIT_SHA="$(git rev-parse --short HEAD)" \
            "$IMAGE" bash -euxc '
              # Hand the workspace back to the runner user however the build ends.
              trap "chown -R \"\$HOST_OWNER\" /src" EXIT
              pacman -Syu --noconfirm --needed git
              git config --global --add safe.directory /src
              sh ./get-dependencies.sh
              DEVEL=false sh ./build-citron.sh
              APP_VERSION="$GIT_SHA" VERSION="$GIT_SHA" ARCH_SUFFIX="" DEVEL=false sh ./package-citron.sh
            '

      - name: Attach to the nightly release
        if: ${{ github.ref_name == 'main' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "nightly-linux"
          make_latest: false
          files: |
            dist/*.AppImage*
            dist/*.tar.zst

      # A cancelled run stops the docker client, not the container it started.
      - name: Remove the build container
        if: always()
        run: docker rm -f "$CONTAINER" 2>/dev/null || true

  # Runs when at least one leg published: a failed leg must not hold back the others' release
  # or the LATEST_VERSION bookkeeping. Which legs made it is read from the release itself.
  release:
    if: ${{ !cancelled() && github.ref_name == 'main' && needs.check-version.outputs.should_build == 'true' }}
    name: "release"
    needs: [check-version, build, build-aarch64]
    permissions:
      contents: write
    runs-on: [self-hosted, linux, podman]

    steps:
      - uses: actions/checkout@v4

      - name: Collect the legs that published
        id: legs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ needs.check-version.outputs.new_hash }}
        run: |
          assets=$(gh release view nightly-linux --repo "${{ github.repository }}" --json assets -q '.assets[].name' || true)
          built=""; missing=""
          for leg in x86_64 x86_64_v3 aarch64; do
            if grep -qx "citron_nightly-${SHA}-linux-${leg}.AppImage" <<<"$assets"; then
              built="$built $leg"
            else
              missing="$missing $leg"
            fi
          done
          built=${built# }; missing=${missing# }
          {
            echo "### Linux nightly \`${SHA}\`"
            echo "- Published: ${built:-none}"
            echo "- Missing: ${missing:-none}"
            echo "- Build results: x86_64 matrix \`${{ needs.build.result }}\`, aarch64 \`${{ needs.build-aarch64.result }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "built=${built}" >> "$GITHUB_OUTPUT"
          if [ -z "$built" ]; then
            echo "::error::No leg published to nightly-linux; LATEST_VERSION stays as it is so the next run rebuilds."
            exit 1
          fi
          [ -z "$missing" ] || echo "::warning::Not published this time: ${missing}"

      - name: Update LATEST_VERSION
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          echo "${{ needs.check-version.outputs.new_hash }}" > LATEST_VERSION
          git add LATEST_VERSION
          git commit -m "Update LATEST_VERSION to ${{ needs.check-version.outputs.new_hash }} [skip ci]" || exit 0
          for i in {1..5}; do
            git pull --rebase origin main && git push && break || sleep 2
          done

      - name: Post to Discord
        run: |
          DOWNLOAD_URL="https://github.com/${{ github.repository }}/releases/tag/nightly-linux"
          DATE=$(date +'%Y-%m-%d')
          WEBHOOK_URL="${{ secrets.DISCORD_WEBHOOK }}"
          if [ -z "$WEBHOOK_URL" ]; then
            echo "DISCORD_WEBHOOK is not set; skipping Discord notification."
            exit 0
          fi
          curl -H "Content-Type: application/json" \
               -d "{\"content\":\"🐧 **New Linux Build Available!**\n\n📦 **Version:** \`${{ needs.check-version.outputs.new_hash }}\`\n📅 **Date:** ${DATE}\n🔗 **Download:** $DOWNLOAD_URL\n\n✨ Builds: ${{ steps.legs.outputs.built }}\"}" \
               "$WEBHOOK_URL"
